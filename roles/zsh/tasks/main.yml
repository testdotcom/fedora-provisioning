---
- name: Install or update oh-my-zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ oh_my_zsh_dir }}"
    depth: 1
    version: main

- name: Configure zsh
  ansible.builtin.template:
    src: zshrc.j2
    dest: "{{ ansible_facts['user_dir'] }}/.zshrc"
    mode: "0644"
    backup: true

- name: Set zsh as default login shell
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /bin/zsh
  become: true
